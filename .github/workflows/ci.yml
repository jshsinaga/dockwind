name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: rustup show

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2

      - name: Run the canonical quality gate
        shell: pwsh
        run: ./scripts/check.ps1
