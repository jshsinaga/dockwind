name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: rustup show

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2

      - name: Resolve and verify the version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"'
          if (-not $match) {
              throw "Cargo.toml does not contain a package version"
          }
          $cargoVersion = $match.Matches[0].Groups[1].Value
          if ($cargoVersion -notmatch '^\d+\.\d+\.\d+$') {
              throw "Cargo.toml version '$cargoVersion' must look like MAJOR.MINOR.PATCH"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $tag = $env:GITHUB_REF_NAME
              if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
                  throw "Tag '$tag' must look like vMAJOR.MINOR.PATCH"
              }
              if ($tag.Substring(1) -ne $cargoVersion) {
                  throw "Tag $tag does not match Cargo.toml version $cargoVersion"
              }
          }
          "version=$cargoVersion" >> $env:GITHUB_OUTPUT

      - name: Build the releases
        shell: pwsh
        run: cargo build --release --locked

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Dockwind-${{ steps.version.outputs.version }}-setup
          path: dist/Dockwind-${{ steps.version.outputs.version }}-setup.exe

      - name: Publish the GitHub release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Dockwind ${{ steps.version.outputs.version }}
          files: dist/Dockwind-${{ steps.version.outputs.version }}-setup.exe
          generate_release_notes: true
